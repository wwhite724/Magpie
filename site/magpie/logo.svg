<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>Magpie</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2F4"/>
      <stop offset="1" stop-color="#D9E3E8"/>
    </linearGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a20"/>
      <stop offset="0.45" stop-color="#1f3a57"/>
      <stop offset="1" stop-color="#1d4f4a"/>
    </linearGradient>
    <linearGradient id="wing" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a20"/>
      <stop offset="1" stop-color="#22426a"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#bg)"/>

  <g transform="translate(60 61) scale(1.15) translate(-57.5 -65)">
    <!-- branch -->
    <path d="M24 86 C46 82 74 81 104 84" stroke="#5b4636" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M86 82.5 C90 78 94 76 99 75" stroke="#5b4636" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- legs -->
    <path d="M64 70 L61.5 83 M69 69.5 L68.5 82.5" stroke="#151a20" stroke-width="1.5" stroke-linecap="round"/>

    <!-- tail -->
    <path d="M54 63 L13 92.5 C11 94 12 96 14.5 95.2 L58 70 Z" fill="url(#tail)"/>

    <!-- head, body and beak in one silhouette -->
    <path d="M104 43.5
             L95.5 40.6
             C93.5 36.6 89.5 34.6 85.5 34.8
             C80.5 35.2 77.2 38.6 76 43.2
             C71.5 47.8 62 52.5 53 60.5
             C51.5 63.5 53 68.5 57.5 70.5
             C64 72.5 72 70.5 77.5 65.5
             C82.5 61 85.5 55.5 88.2 50.3
             C90 47.6 92.5 46.4 95.8 45.6
             Z" fill="#151a20"/>

    <!-- white belly and flank -->
    <path d="M58.5 69.2 C65 71 72.5 69 77 64.6 C80.6 61 82.8 57.4 84.2 54
             C78 57.6 69.5 62.2 59.5 65.6 C57.5 66.6 57.2 68.4 58.5 69.2 Z" fill="#F6F7F8"/>

    <!-- folded wing with a blue sheen and the white scapular stripe -->
    <path d="M79 46.5 C70.5 48 59.5 54.5 49.5 66.5 C58.5 64.8 68 60.5 75.5 54.8 C78.5 52.4 80 49.4 79 46.5 Z" fill="url(#wing)"/>
    <path d="M78.2 47.6 C71.5 49.4 64 53.6 57.4 59 C64.6 56 71.4 53.2 76.6 51.4 C77.8 50.4 78.4 49 78.2 47.6 Z" fill="#F6F7F8"/>

    <!-- eye -->
    <circle cx="88.6" cy="40.6" r="1.7" fill="#2b3138"/>
    <circle cx="89.1" cy="40.1" r="0.55" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
