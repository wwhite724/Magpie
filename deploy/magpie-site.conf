# magpie.whitesberg.net on the "magpie" VM (192.168.10.16), LAN and WireGuard only.
#
# Installed by setup-vm.sh once the Let's Encrypt certificate exists (until then it installs
# magpie-site-http.conf). Serves site/ as it is: the home page and privacy policy for the
# Magpie Google Cloud project (the OAuth consent screen links to them).
#
# Certificate: certbot with the Cloudflare DNS plugin, token acme-magpie in
# /etc/letsencrypt/cloudflare.ini. certbot.timer renews it and its deploy hook reloads NGINX.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name magpie.whitesberg.net 192.168.10.16;
    server_tokens off;
    return 301 https://magpie.whitesberg.net$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name magpie.whitesberg.net;

    ssl_certificate     /etc/letsencrypt/live/magpie.whitesberg.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magpie.whitesberg.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/magpie;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/css;
}
