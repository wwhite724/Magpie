# whitesberg.net through the Cloudflare tunnel (cloudflared -> http://localhost:8081).
#
# Installed by setup-vm.sh. This is the ONLY thing on the home network the internet can reach:
# the static pages in site/ (Whitesberg landing page, Magpie home page and privacy policy).
# It listens on localhost only, so nothing on the LAN or the internet reaches it directly.
# Cloudflare provides the public HTTPS certificate.

server {
    listen 127.0.0.1:8081 default_server;
    server_name whitesberg.net www.whitesberg.net;

    root /var/www/magpie;
    index index.html;

    server_tokens off;

    # log the visitor's address, not cloudflared's
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    access_log /var/log/nginx/whitesberg-public.access.log;

    # static pages only: no uploads, no other methods
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # old addresses from when the Magpie pages were at the top level
    location = /privacy.html { return 301 /magpie/privacy.html; }

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/css;
}
