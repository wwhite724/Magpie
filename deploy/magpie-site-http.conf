# magpie.whitesberg.net on the "magpie" VM (192.168.10.53), LAN and WireGuard only.
#
# HTTP-only fallback: setup-vm.sh installs this only while the VM has no certificate yet.
# Serves site/: the Magpie home page and privacy policy. (The public copies at whitesberg.net, which the
# OAuth consent screen links to, are served by the Whitesberg repo from VM 104.)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name magpie.whitesberg.net 192.168.10.53;

    root /var/www/magpie;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = / { return 302 /magpie/; }

    # old addresses from when the Magpie pages were at the top level
    location = /privacy.html { return 301 /magpie/privacy.html; }

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/css;
}
