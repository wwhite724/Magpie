# magpie.whitesberg.net on the "magpie" VM (192.168.10.16), LAN and WireGuard only.
#
# HTTP-only fallback: setup-vm.sh installs this only while the VM has no certificate yet.
# Serves site/ as it is: the home page and privacy policy
# for the Magpie Google Cloud project (the OAuth consent screen links to them).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name magpie.whitesberg.net 192.168.10.16;

    root /var/www/magpie;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/css;
}
